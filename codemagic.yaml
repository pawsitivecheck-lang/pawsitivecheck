workflows:
  android-capacitor-workflow:
    name: Android Capacitor App
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      vars:
        PACKAGE_NAME: "com.pawsitivecheck.app"
      node: 20.15.0
      npm: 9
      ndk: r25b
      java: 11
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Cocoapods installation (if iOS)
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Update dependencies and build web assets
        script: |
          # npm audit fix
          npm run build
      - name: Update Capacitor Android platform
        script: |
          npx cap sync android
      - name: Build Android Debug
        script: |
          cd android
          ./gradlew assembleDebug
      - name: Build Android Release (unsigned)
        script: |
          cd android
          ./gradlew assembleRelease || ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab