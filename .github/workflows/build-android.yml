name: Build Production Android APK

# Add concurrency control to cancel old builds when new ones start
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    # Ignore documentation and non-code changes to avoid unnecessary builds
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'README*'
  workflow_dispatch: # Manual trigger for immediate builds

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Build Web Application
      run: npm run build
      
    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
        
    - name: Sync Capacitor Android
      run: npx cap sync android
      
    - name: Make Gradlew Executable
      run: chmod +x android/gradlew
      
    - name: Build ONLY Release APK (Force Production)
      run: |
        cd android
        # Clean completely
        ./gradlew clean --no-daemon
        # Force ONLY release build - no debug
        ./gradlew assembleRelease --no-daemon --stacktrace
        # Verify RELEASE APK exists and show its properties
        echo "=== VERIFYING RELEASE APK ==="
        ls -la app/build/outputs/apk/release/
        file app/build/outputs/apk/release/app-release.apk
        # Make sure NO debug APK exists
        echo "=== CHECKING FOR DEBUG APK (should be empty) ==="
        ls -la app/build/outputs/apk/debug/ || echo "Good - no debug directory"
        
    - name: Upload ONLY Release APK
      uses: actions/upload-artifact@v4
      with:
        name: PRODUCTION-RELEASE-APK-v1.0.${{ github.run_number }}
        path: |
          android/app/build/outputs/apk/release/app-release.apk
        retention-days: 90
        if-no-files-found: error
        
    # REMOVED: Create GitHub Release step to prevent cascading builds
    # GitHub releases should only be created manually or through the android-release.yml workflow on tags
    # This prevents the cascading build issue where push → release → tag → android-release.yml triggers