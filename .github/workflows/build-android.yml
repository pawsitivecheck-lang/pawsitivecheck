name: Build Production Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Manual trigger for immediate builds

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Build Web Application
      run: npm run build
      
    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 33
        build-tools: 33.0.2
        
    - name: Sync Capacitor Android
      run: npx cap sync android
      
    - name: Make Gradlew Executable
      run: chmod +x android/gradlew
      
    - name: Build Production Release APK (Unsigned)
      run: |
        cd android
        # Clean any previous builds
        ./gradlew clean
        # Build unsigned release APK (perfect for APKPure/Aptoide)
        ./gradlew assembleRelease --no-daemon --stacktrace --info
        # Verify the APK was created
        ls -la app/build/outputs/apk/release/
        
    - name: Upload Production APK
      uses: actions/upload-artifact@v4
      with:
        name: pawsitivecheck-production-apk-v1.0.${{ github.run_number }}
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 90
        
    - name: Create GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: PawsitiveCheck v1.0.${{ github.run_number }}
        body: |
          ## 📱 PawsitiveCheck Android APK
          
          **Ready for APKPure & Aptoide Upload!**
          
          ### 🚀 Features in this build:
          - Pet product barcode scanning
          - Safety analysis and scoring
          - Community reviews
          - Livestock management
          - Product recall alerts
          
          ### 📱 Installation:
          1. Download the APK file below
          2. Enable "Install from Unknown Sources" on your Android device
          3. Install and test the app
          4. Upload to APKPure/Aptoide when ready
          
          **Commit:** ${{ github.sha }}
          **Build:** #${{ github.run_number }}
        files: android/app/build/outputs/apk/release/app-release.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}